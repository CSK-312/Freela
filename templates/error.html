{% extends 'base.html' %}

{% block title %}{{ heading }} - Freela{% endblock %}

{% block content %}
<div class="main-wrapper" style="max-width: 560px; text-align: center; padding-top: 64px;">
  <div style="font-size: 44px; font-weight: 800; color: #0f5132;">{{ code }}</div>
  <h1 style="font-size: 22px; font-weight: 800; margin: 8px 0;">{{ heading }}</h1>
  <p class="muted" style="font-size: 14px; margin-bottom: 24px;">{{ message }}</p>
  <a href="{{ url_for('home') }}" class="btn btn-primary">Back to jobs</a>
</div>
{% endblock %}
